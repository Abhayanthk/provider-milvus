# Cluster topology definition for Milvus.
config:
  # parametersSchema references a Go type in definition/topologies/cluster
  # for topology parameters (bundled dependency sizing and external overrides).
  parametersSchema: ClusterTopologyParameters
  components:
    proxy:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    rootCoord:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    indexCoord:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    dataCoord:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    queryCoord:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    indexNode:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1}
          resources: {}
    dataNode:
      type: milvus
      replicas: 1
      supportedFields:
        required: [storage]
        properties:
          replicas: {minimum: 1}
          resources: {}
          storage: {}
    queryNode:
      type: milvus
      replicas: 1
      supportedFields:
        required: [storage]
        properties:
          replicas: {minimum: 1}
          resources: {}
          storage: {}
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the cluster Milvus deployment.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Milvus Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
    dataNodes:
      label: Data nodes
      description: Configure the data nodes.
      components:
        replicas:
          path: spec.components.dataNode.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.components.dataNode.resources.limits.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.components.dataNode.resources.limits.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 4
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.5
            storage:
              path: spec.components.dataNode.storage.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 20
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - replicas
        - resources
    proxy:
      label: Proxy
      description: Configure the proxy.
      components:
        replicas:
          path: spec.components.proxy.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.components.proxy.resources.limits.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.components.proxy.resources.limits.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 2
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.5
      componentsOrder:
        - replicas
        - resources
    queryNodes:
      label: Query nodes
      description: Configure the query nodes.
      components:
        replicas:
          path: spec.components.queryNode.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.components.queryNode.resources.limits.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.components.queryNode.resources.limits.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 4
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.5
            storage:
              path: spec.components.queryNode.storage.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 20
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - replicas
        - resources
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced Milvus engine settings shared across all components."
      components:
        configuration:
          uiType: text
          path: spec.components.proxy.parameters.configuration
          fieldParams:
            label: "Engine configuration"
            placeholder: |2
              proxy:
                maxNameLength: 255
              queryNode:
                gracefulTime: 5000
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - configuration
  sectionsOrder:
    - basicInfo
    - dataNodes
    - proxy
    - queryNodes
    - advanced
