# Standalone topology definition for Milvus.
config:
  # parametersSchema references a Go type in definition/topologies/standalone
  # for topology parameters (bundled dependency sizing and external overrides).
  parametersSchema: StandaloneTopologyParameters
  components:
    standalone:
      type: milvus
      replicas: 1
      supportedFields:
        required: [storage]
        properties:
          replicas: {minimum: 1}
          resources: {}
          storage: {}
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the standalone Milvus deployment.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Milvus Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
    resources:
      label: Resources
      description: Configure the core resources for the deployment.
      components:
        replicas:
          uiType: number
          path: spec.components.standalone.replicas
          fieldParams:
            label: Replicas
          validation:
            min: 1
            max: 3
        disk:
          uiType: number
          path: spec.components.standalone.storage.size
          fieldParams:
            label: Disk
            badge: Gi
            badgeToApi: true
          validation:
            min: 10
            max: 500
        cpu:
          uiType: number
          path: spec.components.standalone.resources.limits.cpu
          fieldParams:
            label: CPU
            defaultValue: 1
            step: 0.1
          validation:
            min: 0.1
            required: true
        memory:
          uiType: number
          path: spec.components.standalone.resources.limits.memory
          fieldParams:
            label: Memory
            defaultValue: 4
            step: 0.1
            badge: Gi
            badgeToApi: true
          validation:
            min: 0.5
            required: true
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced Milvus engine settings."
      components:
        configuration:
          uiType: text
          path: spec.components.standalone.parameters.configuration
          fieldParams:
            label: "Engine configuration"
            placeholder: |2
              log:
                level: info
              proxy:
                maxNameLength: 255
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - configuration
  sectionsOrder:
    - basicInfo
    - resources
    - advanced
